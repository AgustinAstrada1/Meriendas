<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestros lugares ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial;
}

#map {
    height: 100vh;
}

#promedio {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 10px;
    font-size: 16px;
    max-width: 80vw;
}

.popup {
    text-align: center;
}

.popup img {
    width: 100%;
    max-width: 250px;
    border-radius: 10px;
    margin-top: 5px;
}

.popup h3 {
    margin: 5px 0;
    font-size: 18px;
}

@media (max-width: 500px) {
    #promedio {
        font-size: 14px;
        padding: 8px;
    }

    .popup {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div id="promedio">Promedio: ⭐ calculando...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([-32.9442, -60.6505], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Mapa'
}).addTo(map);

let puntuaciones = [];

function agregarLugar(lat, lng, nombre, foto, puntajeTuyo, puntajeTiti, comentario) {

    let promedioLugar = ((puntajeTuyo + puntajeTiti) / 2).toFixed(1);

    puntuaciones.push(parseFloat(promedioLugar));

    var marcador = L.marker([lat, lng]).addTo(map);

    marcador.bindPopup(`
        <div class="popup">
            <h3>${nombre}</h3>
            <img src="${foto}"><br>
            ⭐ Agus: ${puntajeTuyo}/10 <br>
            💖 Titi: ${puntajeTiti}/10 <br>
            ⭐ Promedio: ${promedioLugar}/10 <br>
            "${comentario}"
        </div>
    `, { maxWidth: 300 });

    calcularPromedio();
}

function calcularPromedio() {
    let suma = puntuaciones.reduce((a,b) => a+b, 0);
    let promedio = (suma / puntuaciones.length).toFixed(1);

    document.getElementById("promedio").innerText =
        "Promedio general: ⭐ " + promedio;
}

agregarLugar(
    -32.94080868047761,
    -60.64902762244864,
    "Justo ☕",
    "foto1.jpg",
    9.5,
    9,
    "Hasta ahora el mejor lugar al que fuimos"
);

agregarLugar(
    -32.9560100493977, 
    -60.64914161713656,
    "Tostado Cafe Club ☕",
    "foto2.jpg",
    8,
    8.5,
    "Me encanto estar con vos aca"
);

</script>

</body>
</html>
